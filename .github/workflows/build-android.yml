name: Build FloatMouse APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.buildsource/**'
      - '.patchsource/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate FloatMouse source
        shell: bash
        run: |
          cat .buildsource/source.part* > floatmouse-source.tgz.b64
          base64 -d floatmouse-source.tgz.b64 > floatmouse-source.tgz
          tar -xzf floatmouse-source.tgz
          test -f android/app/src/main/AndroidManifest.xml

      - name: Apply v1.1 privacy and safety overlay
        shell: bash
        run: |
          JAVA_DIR=android/app/src/main/java/com/floatmouse/app
          cat .patchsource/MainActivity.part* > "$JAVA_DIR/MainActivity.java"
          cp .patchsource/ConsentActivity.java "$JAVA_DIR/ConsentActivity.java"
          cp .patchsource/LegalActivity.java "$JAVA_DIR/LegalActivity.java"
          cp .patchsource/PrivacySettingsActivity.java "$JAVA_DIR/PrivacySettingsActivity.java"
          cp .patchsource/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp .patchsource/app.build.gradle android/app/build.gradle
          grep -q 'versionName.*1.1.0' android/app/build.gradle
          grep -q 'ConsentActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'PRIVACY & SETTINGS' "$JAVA_DIR/MainActivity.java"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run core tests
        shell: bash
        run: |
          python3 tests/test_receiver_core.py
          mkdir -p /tmp/floatmouse-test
          javac -d /tmp/floatmouse-test android/app/src/main/java/com/floatmouse/app/MotionMath.java android/app/src/main/java/com/floatmouse/app/OpticalFlowMath.java android/app/src/main/java/com/floatmouse/app/Protocol.java tests/TestCore.java
          java -cp /tmp/floatmouse-test TestCore

      - name: Build debug APK
        id: build
        shell: bash
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FloatMouse APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FloatMouse-v1.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest build to repository
        if: success()
        shell: bash
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/FloatMouse-v1.1-debug.apk
          sha256sum builds/FloatMouse-v1.1-debug.apk > builds/SHA256.txt
          printf 'status=success\nrun_id=%s\ncommit=%s\nversion=1.1.0\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/FloatMouse-v1.1-debug.apk builds/SHA256.txt builds/LATEST.txt
          git commit -m 'Publish FloatMouse v1.1 APK' || true
          git push

      - name: Publish failure status
        if: failure()
        shell: bash
        run: |
          mkdir -p builds
          printf 'status=failure\nrun_id=%s\ncommit=%s\nversion=1.1.0\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/LATEST.txt
          git commit -m 'Record failed FloatMouse v1.1 build' || true
          git push || true
