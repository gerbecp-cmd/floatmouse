name: Build Worcester RF Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.rfhelper/build.trigger'
      - '.github/workflows/build-rf-helper.yml'

permissions:
  contents: write

jobs:
  build-rf-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate RF Helper source
        shell: bash
        run: |
          cat .rfhelper/source.part00 .rfhelper/source.part01 .rfhelper/source.part02 .rfhelper/source.part03 .rfhelper/source.part04 .rfhelper/source.part05 .rfhelper/source.part06 .rfhelper/source.part07 .rfhelper/source.part08 > rf-helper-source.zip.b64
          base64 -d rf-helper-source.zip.b64 > rf-helper-source.zip
          unzip -t rf-helper-source.zip
          unzip -q rf-helper-source.zip
          test -f worcester-rf-helper/app/src/main/AndroidManifest.xml
          grep -q "0.4.0-rf-pilot" worcester-rf-helper/app/build.gradle

      - name: Apply v0.4.1 headless RF patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('worcester-rf-helper/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(
              r'\s*<!-- No launcher icon in RF Pilot\..*?-->(?:\s*)<activity\s+android:name="\.MainActivity"\s+android:exported="true"\s*/>',
              '\n\n        <!-- Headless RF pilot: intentionally no Activity is declared. -->',
              text,
              flags=re.S,
          )
          manifest.write_text(text)

          main_activity = Path('worcester-rf-helper/app/src/main/java/com/worcester/rfhelper/MainActivity.java')
          if main_activity.exists():
              main_activity.unlink()

          gradle = Path('worcester-rf-helper/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 4', 'versionCode 5')
          g = g.replace("versionName '0.4.0-rf-pilot'", "versionName '0.4.1-headless-rf-pilot'")
          gradle.write_text(g)
          PY
          grep -q "0.4.1-headless-rf-pilot" worcester-rf-helper/app/build.gradle
          ! grep -q '<activity' worcester-rf-helper/app/src/main/AndroidManifest.xml
          ! test -f worcester-rf-helper/app/src/main/java/com/worcester/rfhelper/MainActivity.java
          ! grep -q "android.intent.category.LAUNCHER" worcester-rf-helper/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test and build APK
        shell: bash
        working-directory: worcester-rf-helper
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk
          sha256sum worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorcesterRFHelper-v0.4.1-headless-rf-pilot-apk
          path: worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        if: success()
        shell: bash
        run: |
          mkdir -p builds
          cp worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk builds/WorcesterRFHelper-v0.4.1-headless-rf-pilot.apk
          sha256sum builds/WorcesterRFHelper-v0.4.1-headless-rf-pilot.apk > builds/WorcesterRFHelper-v0.4.1-SHA256.txt
          printf 'status=success\nrun_id=%s\ncommit=%s\nversion=0.4.1-headless-rf-pilot\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/WorcesterRFHelper-LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/WorcesterRFHelper-v0.4.1-headless-rf-pilot.apk builds/WorcesterRFHelper-v0.4.1-SHA256.txt builds/WorcesterRFHelper-LATEST.txt
          git commit -m 'Publish Worcester RF Helper v0.4.1 headless RF pilot APK' || true
          git push

      - name: Publish failure status
        if: failure()
        shell: bash
        run: |
          mkdir -p builds
          printf 'status=failure\nrun_id=%s\ncommit=%s\nversion=0.4.1-headless-rf-pilot\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/WorcesterRFHelper-LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/WorcesterRFHelper-LATEST.txt
          git commit -m 'Record failed Worcester RF Helper v0.4.1 headless build' || true
          git push || true
