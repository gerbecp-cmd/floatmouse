name: Build Worcester RF Helper + TWL H5 Live Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.rfhelper/build.trigger'
      - '.github/workflows/build-rf-helper.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate RF Helper v0.4.4
        shell: bash
        run: |
          cat .rfhelper44/source.part00 > rf-helper-source.zip.b64
          base64 -d rf-helper-source.zip.b64 > rf-helper-source.zip
          unzip -t rf-helper-source.zip
          unzip -q rf-helper-source.zip
          grep -q "0.4.4-live-h5-test" worcester-rf-helper/app/build.gradle
          grep -q "com.worcester.twlh5simulator" worcester-rf-helper/app/src/main/java/com/worcester/rfhelper/TwlAccessibilityService.java
          grep -q "com.worcester.twlh5simulator" worcester-rf-helper/app/src/main/java/com/worcester/rfhelper/DataWedgeManager.java

      - name: Rehydrate H5 simulator v2.0
        shell: bash
        run: |
          cat .twlh5sim/source.part00 > twl-h5-source.zip.b64
          base64 -d twl-h5-source.zip.b64 > twl-h5-source.zip
          unzip -t twl-h5-source.zip
          unzip -q twl-h5-source.zip
          grep -q "2.0-live-scan" worcester-twl-h5-simulator/app/build.gradle
          grep -q "998995" worcester-twl-h5-simulator/app/src/main/java/com/worcester/twlh5simulator/MainActivity.java
          grep -q "Scan focused field with camera" worcester-twl-h5-simulator/app/src/main/java/com/worcester/twlh5simulator/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build RF Helper
        shell: bash
        working-directory: worcester-rf-helper
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Build H5 simulator
        shell: bash
        working-directory: worcester-twl-h5-simulator
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APKs
        shell: bash
        run: |
          test -s worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk
          test -s worcester-twl-h5-simulator/app/build/outputs/apk/debug/app-debug.apk
          sha256sum worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk
          sha256sum worcester-twl-h5-simulator/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RF Helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorcesterRFHelper-v0.4.4-live-h5-test-apk
          path: worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload H5 simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Worcester-TWL-H5-Test-v2.0-live-scan-apk
          path: worcester-twl-h5-simulator/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APKs to repository
        if: success()
        shell: bash
        run: |
          mkdir -p builds
          cp worcester-rf-helper/app/build/outputs/apk/debug/app-debug.apk builds/WorcesterRFHelper-v0.4.4-live-h5-test.apk
          cp worcester-twl-h5-simulator/app/build/outputs/apk/debug/app-debug.apk builds/Worcester-TWL-H5-Test-v2.0-live-scan.apk
          sha256sum builds/WorcesterRFHelper-v0.4.4-live-h5-test.apk > builds/WorcesterRFHelper-v0.4.4-SHA256.txt
          sha256sum builds/Worcester-TWL-H5-Test-v2.0-live-scan.apk > builds/Worcester-TWL-H5-Test-v2.0-SHA256.txt
          printf 'status=success\nrun_id=%s\ncommit=%s\nhelper=0.4.4-live-h5-test\nsimulator=2.0-live-scan\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/Worcester-TWL-H5-LIVE-LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/WorcesterRFHelper-v0.4.4-live-h5-test.apk builds/Worcester-TWL-H5-Test-v2.0-live-scan.apk builds/WorcesterRFHelper-v0.4.4-SHA256.txt builds/Worcester-TWL-H5-Test-v2.0-SHA256.txt builds/Worcester-TWL-H5-LIVE-LATEST.txt
          git commit -m 'Publish Worcester TWL H5 live tote test APKs' || true
          git push

      - name: Publish failure status
        if: failure()
        shell: bash
        run: |
          mkdir -p builds
          printf 'status=failure\nrun_id=%s\ncommit=%s\nhelper=0.4.4-live-h5-test\nsimulator=2.0-live-scan\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > builds/Worcester-TWL-H5-LIVE-LATEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/Worcester-TWL-H5-LIVE-LATEST.txt
          git commit -m 'Record failed Worcester TWL H5 live tote test build' || true
          git push || true
